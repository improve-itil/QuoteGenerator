name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist/src
          cp index.html styles.css dist/
          cp src/app.js dist/src/
          cp -R assets config dist/

      - name: Inject Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const config = {
            url: process.env.SUPABASE_URL || "",
            anonKey: process.env.SUPABASE_ANON_KEY || "",
          };
          fs.mkdirSync("dist/config", { recursive: true });
          fs.writeFileSync(
            "dist/config/supabase-config.js",
            `window.IMPROVE_IT_SUPABASE = ${JSON.stringify(config, null, 2)};\n`
          );
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
